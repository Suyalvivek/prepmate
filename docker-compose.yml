services:
  postgres:
    image: postgres:16-alpine
    container_name: prepmate_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: prepmate
      POSTGRES_PASSWORD: prepmate_dev
      POSTGRES_DB: prepmate_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prepmate -d prepmate_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres_test:
    image: postgres:16-alpine
    container_name: prepmate_postgres_test
    restart: unless-stopped
    environment:
      POSTGRES_USER: prepmate
      POSTGRES_PASSWORD: prepmate_test
      POSTGRES_DB: prepmate_test
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  postgres_test_data:
